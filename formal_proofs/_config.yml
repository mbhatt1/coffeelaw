title: Collective Information Acquisition
description: What a group of communicating agents, with or without tools, can and cannot learn about the world. Proofs and exact checks.
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout
optional_front_matter:
  remove_originals: true
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false
exclude:
  - README.md
  - "*.py"
  - Gemfile
  - Gemfile.lock
