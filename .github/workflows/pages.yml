name: Formal proofs site

on:
  push:
    branches: [main]
    paths:
      - "formal_proofs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "formal_proofs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python3 -m pip install numpy

      - name: Run the checks
        working-directory: formal_proofs
        run: |
          python3 verify.py
          python3 verify_llm.py
          python3 verify_geometry.py
          python3 verify_extensions.py
          python3 verify_capacity.py

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./formal_proofs
          destination: ./_site

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lean proofs (fails on any sorry)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_proofs/lean
          build-args: "--wfail"

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, lean]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
