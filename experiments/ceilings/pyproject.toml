[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceilings"
version = "0.1.0"
description = "Experiment harness testing the Coffee Law's information, reasoning and communication ceilings"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "jsonschema>=4.20",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4"]
notebook = ["matplotlib>=3.8", "nbformat>=5.9", "nbconvert>=7.10", "ipykernel>=6.26", "jupyter-client>=8.6", "notebook>=7.0"]

[project.scripts]
ceilings = "ceilings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceilings = ["data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job; long literals are left intact

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
